# Put this top-level key before any [table] in ~/.codex/config.toml.
# The launcher generates this file from the native cache + external-models.json.
model_catalog_json = "/absolute/path/to/desktop-providers.generated.json"

# Merge alongside your existing provider table.
# Keep the global model_provider unset (or "openai") to preserve native login.
# This profile references [model_providers.openrouter]; it contains no API key.

[profiles.openrouter-glm-5-3-flash]
model = "z-ai/glm-5.3-flash"
model_provider = "openrouter"
