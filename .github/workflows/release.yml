name: Build release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag; leave empty to test the selected branch without publishing
        required: false
        type: string
      publish:
        description: Attach packages to the existing published Release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG != '' && format('refs/tags/{0}', env.RELEASE_TAG) || github.ref }}
          persist-credentials: false
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check source and upstream integration
        run: nix flake check --print-build-logs
      - name: Build tool
        run: nix build --print-build-logs
      - name: Create portable package
        run: |
          nix develop --command node scripts/build-release.mjs \
            --package "$(readlink -f result)/lib/node_modules/codex-desktop-providers" \
            --revision "$(git rev-parse HEAD)" \
            --tag "$RELEASE_TAG"
      - name: Verify extracted package
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          mkdir release-test
          tar -xzf release/*.tar.gz -C release-test --strip-components=1
          nix develop --command ./release-test/dist/cli.js --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-package
          path: |
            release/*.tar.gz
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  standalone:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
          - target: windows-x64
            runner: windows-2025
          - target: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG != '' && format('refs/tags/{0}', env.RELEASE_TAG) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-package
          path: compiled
      - name: Bundle official Node runtime
        run: |
          node scripts/build-standalone.mjs --input compiled --output release \
            --target "$RELEASE_TARGET" --tag "$RELEASE_TAG" \
            --revision "$(git rev-parse HEAD)"
      - name: Test extracted package without Node on PATH
        run: node scripts/verify-standalone.mjs --revision "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-package-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  upload:
    if: github.event_name == 'release' || (inputs.tag != '' && inputs.publish)
    needs: [build, standalone]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-package*
          merge-multiple: true
          path: release
      - name: Merge and verify all package checksums
        run: |
          cat release/SHA256SUMS release/SHA256SUMS.* | sort -k 2 > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" release/SHA256SUMS
          (cd release && sha256sum --check SHA256SUMS)
      - name: Attach package to existing Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          gh release upload "$RELEASE_TAG" release/*.tar.gz release/*.zip release/SHA256SUMS --clobber
